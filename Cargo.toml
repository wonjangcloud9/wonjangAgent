[package]
name = "wonjang"
version = "0.95.0"
edition = "2021"
description = "원장 에이전트 — 로컬 환경을 다루는 한국어 우선 자율 AI 에이전트 (Rust)"
license = "MIT"
repository = "https://github.com/wonjangcloud9/wonjangAgent"

[[bin]]
name = "wonjang"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-std", "io-util", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
owo-colors = "4"
toml = "0.8"
dirs = "5"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
calamine = "0.26"
zip = { version = "2", default-features = false, features = ["deflate"] }
qrcode = { version = "0.14", default-features = false }
sha2 = "0.10"
similar = "2"
base64 = "0.22"
getrandom = "0.2"
chrono-tz = "0.10"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
encoding_rs = "0.8.35"
lopdf = { version = "0.40.0", default-features = false }

[profile.release]
strip = true
lto = true
opt-level = "z"
