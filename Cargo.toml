[package]
name = "wonjang"
version = "0.6.0"
edition = "2021"
description = "원장 에이전트 — 로컬 환경을 다루는 한국어 우선 자율 AI 에이전트 (Rust)"
license = "MIT"
repository = "https://github.com/wonjangcloud9/wonjangAgent"

[[bin]]
name = "wonjang"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-std", "io-util", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
owo-colors = "4"
toml = "0.8"
dirs = "5"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
strip = true
lto = true
opt-level = "z"
